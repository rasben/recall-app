# Cloudflare Worker config for Recall telemetry
# Deploy with: npm run deploy   (= npx wrangler deploy)
#
# First-time setup (D1 replaces the old KV install counter):
#   1. npx wrangler login
#   2. npx wrangler d1 create recall-telemetry
#      → copy the database_id it prints into [[d1_databases]] below
#   3. npm run db:init            (creates the `pings` table from schema.sql)
#   4. npm run deploy
#   5. The deployed URL is already in src-tauri/src/telemetry.rs (PING_URL);
#      update it there if the worker name or account subdomain changes.
#
# Local development:
#   npm run db:init:local && npx wrangler dev

name = "recall-telemetry"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "recall-telemetry"
database_id = "204af553-42e0-4076-b0f0-de4dec9df3fb"
