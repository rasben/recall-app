[package]
name = "recall-app"
version = "0.0.0"
description = "A Tauri App"
authors = ["Benjamin Rasmussen"]
edition = "2021"
# `src/bin/recall.rs` is a second binary; keep `cargo run` / `tauri dev`
# pointed at the desktop app.
default-run = "recall-app"

[lib]
name = "recall_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: the Claude setup rewrites the user's Claude settings.json and
# must keep their key order.
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
specta-typescript = "0.0.7"
rusqlite = { version = "0.41", features = ["bundled"] }
once_cell = "1.21"
tauri-plugin-dialog = "2.7.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v5", "v4"] }
ical = "0.11"
rrule = "0.14"
tokio = { version = "1", features = ["rt"] }
ureq = { version = "3.3", features = ["json"] }
base64 = "0.23"
urlencoding = "2"
# Same major as Tauri's, so `default_db_path` resolves exactly like `app_data_dir`.
dirs = "7"

[dev-dependencies]
# `test` enables `tauri::test::mock_app()`, so unit tests can build a real
# `State<'_, AppState>` around an in-memory SQLite DB without a window.
tauri = { version = "2", features = ["test"] }
# Commands use `tokio::task::block_in_place`, which needs a multi-thread runtime.
tokio = { version = "1", features = ["rt-multi-thread"] }
